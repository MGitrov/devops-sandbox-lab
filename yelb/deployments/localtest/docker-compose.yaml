version: "2.1"
services: # A reusable definition of a container: which image to run, plus how to configure it (ports, env vars, volumes, networks, restart policy, replica count, and so on).
  yelb-ui: # Service name. The service name is also a DNS name within the shared default network, we don't need IP addresses.
    image: mreferre/yelb-ui:0.10
    depends_on:
      - yelb-appserver
    ports:
      - 8080:80 # HOST:CONTAINER - Traffic that hits port 8080 on our machine goes to port 80 inside the container. `ports` only matters for traffic coming from outside.
    environment: # Sets environment variables inside a container.
      - UI_ENV=test # dev | test | prod 

  yelb-appserver:
    image: mreferre/yelb-appserver:0.7
    depends_on:
      - redis-server
      - yelb-db
    ports:
      - 4567:4567
    environment:
      - RACK_ENV=test # development | test | production 

  redis-server:
    image: redis:4.0.2
    ports:
      - 6379:6379

  yelb-db:
    image: mreferre/yelb-db:0.6
    ports:
      - 5432:5432
